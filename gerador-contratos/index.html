<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ContratoFácil — Gerador de Contratos</title>
  <meta name="description" content="Gere contratos em Word e PDF a partir dos seus modelos, com campos inteligentes, consulta de CNPJ e edição de cláusulas.">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('cf-tema') || 'auto';
        var dark = t === 'escuro' || (t !== 'claro' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>Ative o JavaScript para usar o ContratoFácil.</noscript>
  <script src="app.js"></script>
</body>
</html>
